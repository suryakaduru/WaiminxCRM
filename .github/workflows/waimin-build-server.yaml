name: Waimin Build & Publish Server Image

# Builds a thin branded overlay on twentycrm/twenty:latest and pushes to GHCR.
# Use this image in deploy/.env for production split-services compose.

on:
  push:
    branches: [waimin]
    paths:
      - 'packages/twenty-docker/waimin-server/**'
      - 'packages/twenty-front/index.html'
      - 'packages/twenty-front/public/images/waimin-logo.png'
      - 'packages/twenty-front/src/modules/auth/**'
      - 'packages/twenty-front/src/pages/auth/**'
      - '.github/workflows/waimin-build-server.yaml'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream twentycrm/twenty tag to base on'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/waiminxcrm-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=waimin
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/waimin-server/Dockerfile
          build-args: |
            UPSTREAM_TAG=${{ github.event.inputs.upstream_tag || 'latest' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
