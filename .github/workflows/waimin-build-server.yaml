name: Waimin Build & Publish Server Image (source build)

# Builds the Waimin-branded server+frontend image FROM SOURCE using the existing
# upstream Dockerfile's `twenty` target. The frontend bundle is compiled with
# the waimin branch's branded TSX files (Logo.tsx, SignInUp.tsx, FooterNote.tsx,
# index.html, waimin-logo.png), so every UI element is properly branded — no
# overlay/sed needed.
#
# Output: ghcr.io/<owner>/waiminxcrm-server:waimin (also :latest, :sha-<sha>)

on:
  push:
    branches: [waimin]
    paths-ignore:
      - 'deploy/**'
      - '**.md'
      - '.cursor/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/waiminxcrm-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=waimin
            type=sha,prefix=sha-

      - name: Build and push (server + branded frontend, from source)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
